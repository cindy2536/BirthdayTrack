<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Sign Up</title>
</head>
<body>
    <section>
        <h1>Sign Up</h1>
        <form class="SignUpform">
            <div class="form">
                <label for="signupname">Name: </label>
                <input type="text" id="signupname" required />
            </div>
            <div class="form">
                <label for="signupdob">Date of Birth: </label>
                <input type="date" id="signupdob" required />
            </div>
            <div class="form">
                <label for="signupemail">Email: </label>
                <input type="email" id="signupemail" required />
            </div>
            <div class="form">
                <label for="signuppassword">Password: </label>
                <input type="password" id="signuppassword" required />
            </div>
            <button id="signupbtn">Sign Up</button>
        </form>
        <p class="foot">Already have an account? <a href="login.html">Log in here</a></p>
    </section>

    <script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.8.4/firebase-database-compat.js"></script>
    <script src="firebase.js"></script>
</body>
</html>
